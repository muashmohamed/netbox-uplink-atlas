[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-uplink-atlas"
version = "0.1.0"
description = "Read-only NetBox plugin: racks on a satellite map, fiber uplinks between them, and where to look when things go down."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Muash Mohamed" }]
classifiers = ["Framework :: Django", "Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/muashmohamed/netbox-uplink-atlas"

[tool.setuptools.packages.find]
include = ["netbox_uplink_atlas*"]

[tool.setuptools.package-data]
netbox_uplink_atlas = ["templates/**/*"]
